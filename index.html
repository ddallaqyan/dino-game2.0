<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Динозавр: Лес</title>
<style>

:root:not([data-theme="light"]) body{background:#1d3b24}

.ov.on{display:flex}
h1{font-size:clamp(34px,10vw,68px);margin:0 0 12px;text-shadow:0 4px 0 #3b220e,0 0 24px #000a}
.btn{background:linear-gradient(var(--w),var(--w2));border:3px solid #3b220e;color:var(--t);font-size:20px;font-weight:700;padding:12px 24px;border-radius:14px;min-width:230px;cursor:pointer;box-shadow:0 4px 0 #3b220e;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b220e}
.panel{background:#000a;border-radius:16px;padding:12px;max-width:460px;width:100%}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px}
.row span{flex:1}.row .btn{min-width:48px;padding:8px 12px}
#build{justify-content:flex-end;background:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.egg{position:relative;width:34vmin;height:46vmin}
.eh{position:absolute;inset:0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fffbe8,#e8d9a8 55%,#b79a5a);box-shadow:inset -8px -10px 20px #0004,0 12px 30px #0008;transition:transform .9s ease-in,opacity .9s}
.eh.t{clip-path:polygon(0 0,100% 0,100% 52%,86% 60%,72% 46%,58% 58%,44% 44%,30% 58%,16% 47%,0 55%)}
.eh.b{clip-path:polygon(0 55%,16% 47%,30% 58%,44% 44%,58% 58%,72% 46%,86% 60%,100% 52%,100% 100%,0 100%)}
.glow{position:absolute;left:50%;top:50%;width:10vmin;height:10vmin;margin:-5vmin;border-radius:50%;background:radial-gradient(#fff,#ffd54a 40%,#0000 70%);opacity:0;transition:opacity .8s,transform 1s}
.egg.shk{animation:sh .18s infinite}.egg.crk{animation:sh .1s infinite}.egg.crk .glow{opacity:.9}
.egg.open{animation:none}.egg.open .eh.t{transform:translateY(-90%) rotate(-35deg);opacity:0}.egg.open .eh.b{transform:translateY(25%) rotate(10deg);opacity:0}.egg.open .glow{opacity:1;transform:scale(14)}
.shake{animation:sh .25s infinite}
@keyframes sh{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

#hud.on,#spawnw.on{display:block}
#hud>*{position:fixed}
#mb{top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;min-width:0;padding:6px 12px;font-size:20px}
#st{top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:150px}
.bar{position:relative;height:16px;background:#0008;border-radius:8px;overflow:hidden;margin-bottom:4px}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;display:block}
.bar b{position:absolute;left:4px;top:-1px;font-size:12px}
#info{font-size:13px;text-align:right;text-shadow:0 1px 3px #000}
#joy{left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:130px;height:130px;border-radius:50%;background:#fff3;border:3px solid #fff6;display:flex;align-items:center;justify-content:center}

#abs .btn{min-width:0;width:54px;height:54px;padding:0;font-size:26px;border-radius:50%}
#spawnw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center}
#night{position:fixed;inset:0;background:#16286e;mix-blend-mode:multiply;opacity:0;pointer-events:none}
#toast{position:fixed;top:34%;left:0;right:0;text-align:center;font-size:24px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .4s}
#flash{position:fixed;inset:0;background:#ff5522;opacity:0;pointer-events:none}

const cm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,fog:false});for(let i=0;i<8;i++){const c=new THREE.Group();for(let j=0;j<4;j++){const m=new THREE.Mesh(SG,cm);m.scale.set(8+R()*6,4+R()*2,6+R()*3);m.position.set(j*8-12,R()*2,R()*4);c.add(m)}c.position.set((R()-.5)*280,50+R()*15,(R()-.5)*200);sc.add(c);cl.push(c)}}
const bushG=new THREE.SphereGeometry(.9,8,6),bushM=LM(0x2faa44),bushes=[];
for(let i=0;i<30;i++){const m=new THREE.Mesh(bushG,bushM);m.position.set((R()-.5)*180,.6,(R()-.5)*180);if(Math.hypot(m.position.x-POND.x,m.position.z-POND.z)<POND.r+1)m.position.x+=20;sc.add(m);bushes.push({m,t:0})}
const preyG=[];
function mkPreyOld(){const g=new THREE.Group();g.add(mk(0x9a6a3a,.8,.6,1.2,0,.6,0),mk(0xb98a55,.4,.4,.5,0,.9,.75),mk(0x6b4423,.15,.5,.15,.25,.25,.4),mk(0x6b4423,.15,.5,.15,-.25,.25,-.4));return g}
for(const[n,a,b,hp,ty]of[[10,.3,.55,20,0],[8,.8,1.2,50,1],[4,1.2,1.6,150,2],[3,1,1.3,120,3]])for(let i=0;i<n;i++){const g=ty==0?mkPrey():makeDino(ty==2?[[2,2,2,2],[3,3,3,3],[18,18,18,18]][i%3]:ty==3?[[4,4,4,4],[11,11,11,11],[6,6,6,6]][i%3]:(()=>{const q=[1,16,17,19,13,18,9,10][i];return[q,q,q,q]})());g.scale.setScalar(a+R()*(b-a));sc.add(g);const p={g,hp,mhp:hp,ty,dead:false,rt:0,dx:0,dz:0,wt:0,bt:0,mv:false};rndPos(p);preyG.push(p)}
function rndPos(p){p.g.position.set((R()-.5)*190,0,(R()-.5)*190);if(p.ty>1&&Math.hypot(p.g.position.x,p.g.position.z)<40)p.g.position.x+=45;p.hp=p.mhp||20;p.dead=false;p.g.visible=true}
function mk(c,w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),LM(c));m.position.set(x,y,z);return m}

function makeDinoOld(p){const g=new THREE.Group(),[H,B,L,T]=p,bs=.9+(B%5)*.12,ll=.6+(L%5)*.15,hs=.5+(H%4)*.12,tl=1.2+(T%5)*.35,by=ll+.5*bs;
g.add(mk(col(B),1.1*bs,bs,2*bs,0,by,0),mk(col(B),.4,.8,.4,0,by+.6*bs,bs));
const hy=by+1.1*bs,hz=1.2*bs+.3;g.add(mk(col(H),.6*hs+.3,.5*hs+.2,.9*hs+.3,0,hy,hz));
g.add(mk(0x111111,.08,.08,.08,.2,hy+.1,hz+.4*hs+.1),mk(0x111111,.08,.08,.08,-.2,hy+.1,hz+.4*hs+.1));
if(H%3==0)for(const s of[-1,1]){const c=new THREE.Mesh(new THREE.ConeGeometry(.1,.6,5),LM(0xeeeecc));c.position.set(s*.2,hy+.4,hz);c.rotation.x=.4;g.add(c)}
if(B%2==0)for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(.15,.4,4),LM(col(B+3)));c.position.set(0,by+.6*bs,(i-1)*.6*bs);g.add(c)}
for(let i=0;i<3;i++){const k=1-i*.28;g.add(mk(col(T),.6*bs*k,.6*bs*k,tl/3,0,by-.1*i,-(bs+tl/3*(i+.5))))}
for(const x of[-1,1])for(const z of[-1,1])g.add(mk(col(L),.3,ll,.3,x*.45*bs,ll/2,z*.6*bs));
return g}
const ST=(p,s)=>({hp:(60+(p[1]%7)*10)*(.5+.5*s),sp:5+(p[2]%6)*.6,dm:(8+(p[0]%6)*2)*(.5+.5*s)});
let mode='menu',parts=[4,0,0,4],P=null,G=null,t0=0,fx=[],jx=0,jz=0,tt=0;
const K={};
function show(id){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));if(id)$(id).classList.add('on')}
function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1200)}
function setP(d){if(P)sc.remove(P);P=makeDino(parts);P.position.set(d?G.x:0,0,d?G.z:0);sc.add(P)}
function hud(on){$('hud').classList.toggle('on',on)}
// меню
$('bPlay').onclick=()=>{show('egg');mode='egg';const e=$('eggE');e.textContent='🥚';e.className='shake';
setTimeout(()=>e.textContent='💥',1500);setTimeout(()=>{e.className='';e.textContent='🐣'},2000);setTimeout(()=>{show('build');mode='build';setP(0);upBuild()},2900)};
$('bSaves').onclick=()=>{show('saves');mode='menu';const sv=load(),l=$('sl');l.innerHTML='';
if(!sv){l.textContent='Пока пусто';return}
l.innerHTML=`<p>День ${sv.day}/100 · ${sv.diet=='h'?'Хищник':'Травоядный'} · убийств: ${sv.kills}</p>`;
const a=document.createElement('button');a.className='btn';a.textContent='▶ Загрузить';a.onclick=()=>{parts=sv.parts;G=sv;setP(1);startPlay()};
const b=document.createElement('button');b.className='btn';b.textContent='🗑 Удалить';b.onclick=()=>{try{localStorage.removeItem('dinoSave')}catch(e){}$('bSaves').onclick()};
l.append(a,' ',b)};
$('sB').onclick=()=>show('menu');
function load(){try{return JSON.parse(localStorage.getItem('dinoSave'))}catch(e){return null}}
// конструктор
const rows=$('rows');PN.forEach((n,i)=>{rows.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-i="${i}" data-s="-1">◀</button><span><b>${n}:</b> <i id="pn${i}"></i></span><button class="btn" data-i="${i}" data-s="1">▶</button></div>`)});
rows.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;parts[i]=(parts[i]+ +b.dataset.s+D.length)%D.length;setP(0);upBuild()};
$('bRnd').onclick=()=>{parts=parts.map(()=>Math.floor(R()*D.length));setP(0);upBuild()};
function upBuild(){parts.forEach((p,i)=>$('pn'+i).textContent=D[p]);const s=ST(parts,1);$('stat').textContent=`❤️ ${Math.round(s.hp)} · 🦷 ${Math.round(s.dm)} · 👟 ${s.sp.toFixed(1)}`}
$('bDone').onclick=()=>{show(null);mode='idle';$('spawnw').classList.add('on')};
$('bSpawn').onclick=()=>{$('spawnw').classList.remove('on');show('diet')};
$('diet').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;G={diet:b.dataset.d,day:0,dayT:0,food:100,water:100,kills:0,abs:[],hp:null,x:0,z:0,parts:parts.slice(),cd:{},ac:0,pulse:0};setP(1);startPlay()};
function startPlay(){G.cd={};G.ac=0;G.pulse=0;const s=gro();if(G.hp==null)G.hp=ST(parts,s).hp;show(null);hud(true);$('spawnw').classList.remove('on');mode='play';refAbs();toast(G.diet=='h'?'Охоться на зверьков! 🥩':'Ешь кусты 🌿 (кнопка 🦷)')}
const gro=()=>.35+.65*Math.min(1,(G.day+G.dayT/DAYLEN)/20);
// управление
const J=$('joy'),kn=$('knob');let jid=null;
function mv(e){const r=J.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const L=r.width/2,m=Math.hypot(x,y);if(m>L){x*=L/m;y*=L/m}jx=x/L;jz=y/L;kn.style.transform=`translate(${x}px,${y}px)`}
J.addEventListener('pointerdown',e=>{jid=e.pointerId;J.setPointerCapture(e.pointerId);mv(e)});
J.addEventListener('pointermove',e=>{if(e.pointerId===jid)mv(e)});
const je=e=>{if(e.pointerId===jid){jid=null;jx=jz=0;kn.style.transform='translate(0,0)'}};
J.addEventListener('pointerup',je);J.addEventListener('pointercancel',je);
$('atk').addEventListener('pointerdown',e=>{e.preventDefault();atk()});
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space')atk()});addEventListener('keyup',e=>K[e.code]=0);
// действия
function near(arr,get,r){let b=null,bd=r;for(const o of arr){const d=P.position.distanceTo(get(o).position);if(d<bd&&!(o.dead||o.t>0)){bd=d;b=o}}return b}
function atk(){if(mode!='play'||G.ac>0)return;const s=gro(),st=ST(parts,s),r=2.5+3*s;G.ac=.45;G.pulse=.15;P.userData.bite=.3;
if(G.diet=='v'){const b=near(bushes,o=>o.m,r);if(b){b.t=20;b.m.visible=false;G.food=Math.min(100,G.food+30);toast('+🌿');return}}
const p=near(preyG,o=>o.g,r+2);if(p){p.hp-=st.dm;if(p.hp<=0)kill(p)}}
function kill(p){p.dead=true;p.rt=6;p.g.visible=false;G.kills++;if(G.diet=='h'){G.food=Math.min(100,G.food+(p.ty>1?100:p.ty?60:40));toast('+🍖')}if(G.kills%10==0)offer()}
function offer(){const rem=AB.filter(a=>!G.abs.includes(a.n));if(!rem.length)return;rem.sort(()=>R()-.5);const l=$('abl');l.innerHTML='';
rem.slice(0,3).forEach(a=>{const b=document.createElement('button');b.className='btn';b.style.display='block';b.style.margin='8px auto';b.textContent=`${a.e} ${a.n}`;b.onclick=()=>{G.abs.push(a.n);refAbs();show(null);mode='play'};l.append(b)});mode='choose';show('abil')}
let abB=[];
function refAbs(){const c=$('abs');c.innerHTML='';abB=G.abs.map(n=>{const a=AB.find(x=>x.n==n),b=document.createElement('button');b.className='btn';b.textContent=a.e;b.addEventListener('pointerdown',e=>{e.preventDefault();useAb(a)});c.append(b);return[b,a]})}
function useAb(a){if(mode!='play'||G.cd[a.n]>0)return;G.cd[a.n]=6;const s=gro(),r=a.r*(.8+.2*s);
const m=new THREE.Mesh(new THREE.RingGeometry(.9,1,40),new THREE.MeshBasicMaterial({color:a.c,transparent:true,side:THREE.DoubleSide}));m.rotation.x=-PI/2;m.position.set(P.position.x,.2,P.position.z);sc.add(m);fx.push({m,t:0,r});
G.hp=Math.min(ST(parts,s).hp,G.hp+a.h);for(const p of preyG)if(!p.dead&&p.g.position.distanceTo(P.position)<r){p.hp-=a.d;if(p.hp<=0)kill(p)}toast(a.e+' '+a.n)}
// меню в игре
$('mb').onclick=()=>{if(mode=='play'){mode='paused';show('pause')}};
$('pC').onclick=()=>{show(null);mode='play'};
$('pY').onclick=()=>{try{G.x=P.position.x;G.z=P.position.z;G.parts=parts;localStorage.setItem('dinoSave',JSON.stringify(G))}catch(e){}toMenu()};
$('pN').onclick=toMenu;
function toMenu(){hud(false);mode='menu';if(P){sc.remove(P);P=null}show('menu')}
$('eB').onclick=()=>{toMenu();$('bPlay').onclick()};
function endGame(t){mode='dead';hud(false);$('eT').textContent=t;show('end')}
// цикл
let last=performance.now(),meteor=null,mt=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;f.m.scale.setScalar(Math.max(.1,f.r*f.t/.6));f.m.material.opacity=Math.max(0,1-f.t/.6);if(f.t>.6){sc.remove(f.m);fx.splice(i,1)}}
setDay(G&&(mode=='play'||mode=='paused'||mode=='choose'||mode=='meteor')?dayL():1);for(const c of cl){c.position.x+=dt*2;if(c.position.x>140)c.position.x=-140}pond.material.opacity=.82+Math.sin(tt*2)*.06;if(P){sun.position.set(P.position.x+25,45,P.position.z+15);sun.target.position.copy(P.position)}if(P)anim(P,tt,mode=='play'&&MV,dt);for(const p of preyG){const v=!p.dead&&p.g.position.distanceTo(cam.position)<85;p.g.visible=v;if(v)anim(p.g,tt,p.mv,dt)}
if(mode=='menu'||mode=='egg'){cam.position.set(Math.cos(tt*.1)*28,9,Math.sin(tt*.1)*28);cam.lookAt(0,3,0)}
else if(mode=='build'){P.rotation.y+=dt;const h=P.userData.h;cam.position.set(h*.8+2,h*.5+1,h*1.4+4);cam.lookAt(0,h*.15-1,0)}
if(mode=='idle'){P.rotation.y+=dt*.5;const h=P.userData.h;cam.position.set(h+2,h*.5+1,h*1.5+4);cam.lookAt(0,h*.35,0)}
if(mode=='play'||mode=='paused'||mode=='choose'||mode=='meteor')world(dt);
ren.render(sc,cam)}
function world(dt){const s=gro(),st=ST(parts,s),pl=P.position;
if(mode=='play'){
G.dayT+=dt;if(G.dayT>=DAYLEN){G.dayT=0;G.day++;if(G.day>=100){mode='meteor';mt=0;meteor=new THREE.Mesh(new THREE.SphereGeometry(4,12,8),new THREE.MeshBasicMaterial({color:0xff6a00}));meteor.position.set(pl.x+60,90,pl.z-60);sc.add(meteor)}}
G.food-=.9*dt;G.water-=1.2*dt;G.food=Math.max(0,G.food);G.water=Math.max(0,G.water);G.ac-=dt;G.pulse=Math.max(0,G.pulse-dt);
for(const k in G.cd)G.cd[k]-=dt;
if(G.food<=0||G.water<=0)G.hp-=3*dt;else if(G.food>30&&G.water>30)G.hp=Math.min(st.hp,G.hp+dt);
if(G.hp<=0)return endGame('Ты погиб 💀 (день '+G.day+')');
let ix=jx+(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),iz=jz+(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m}
MV=m>.08;if(m>.08){pl.x=Math.max(-100,Math.min(100,pl.x+ix*st.sp*dt));pl.z=Math.max(-100,Math.min(100,pl.z+iz*st.sp*dt));const f=Math.atan2(ix,iz),d=((f-P.rotation.y+PI)%(2*PI)+2*PI)%(2*PI)-PI;P.rotation.y+=d*Math.min(1,dt*10);pl.y=Math.abs(Math.sin(tt*10))*.12*s}else pl.y=0;
if(Math.hypot(pl.x-POND.x,pl.z-POND.z)<POND.r)G.water=Math.min(100,G.water+30*dt);
P.scale.setScalar(s);
for(const b of bushes)if(b.t>0){b.t-=dt;if(b.t<=0)b.m.visible=true}
for(const p of preyG){if(p.dead){p.rt-=dt;if(p.rt<=0){rndPos(p);p.g.position.add(pl.clone().sub(p.g.position).setLength(-25).setY(0))}continue}
const q=p.g.position,d=q.distanceTo(pl);p.wt-=dt;let sp=1.5;
if(p.ty==3&&d<35){p.dx=pl.x-q.x;p.dz=pl.z-q.z;sp=4.5;p.bt-=dt;if(d<3.5*p.g.scale.x+2*s&&p.bt<=0){p.bt=1.2;p.g.userData.bite=.3;G.hp-=6+3*p.g.scale.x;toast('🩸 Укус!')}}else if(d<9&&p.ty<2){p.dx=q.x-pl.x;p.dz=q.z-pl.z;sp=5}else if(p.wt<=0){p.wt=1+R()*3;const a=R()*2*PI;p.dx=Math.sin(a)*(R()<.4?0:1);p.dz=Math.cos(a)*(R()<.4?0:1)}
const l=Math.hypot(p.dx,p.dz);p.mv=l>.01;if(l>.01){q.x=Math.max(-100,Math.min(100,q.x+p.dx/l*sp*dt));q.z=Math.max(-100,Math.min(100,q.z+p.dz/l*sp*dt));p.g.rotation.y=Math.atan2(p.dx,p.dz)}}
for(const [b,a] of abB){b.style.opacity=G.cd[a.n]>0?.4:1}
$('bh').style.width=Math.max(0,G.hp/st.hp*100)+'%';$('bf').style.width=G.food+'%';$('bw').style.width=G.water+'%';
$('info').textContent=`${dayL()>.45?'☀️':'🌙'} День ${G.day}/100 · 🎯 ${G.kills}`+(s<1?' · растёшь':' · взрослый')}
if(mode=='meteor'){mt+=dt;meteor.position.lerp(pl,Math.min(1,mt/3.2*dt*3));meteor.position.y-=dt*(26);meteor.position.x-=dt*-0;$('flash').style.opacity=Math.max(0,mt-2.4)/1;
if(mt>3.6){sc.remove(meteor);$('flash').style.opacity=0;endGame('☄️ Упал метеорит! Мы вымерли. Игра начнётся заново')}}
const ex=pl.x,ez=pl.z;const k=1-Math.exp(-dt*5);
cam.position.x+=(ex-cam.position.x)*k;const sz=s*(P.userData.h||3)/3;cam.position.x+=0;cam.position.y+=((3+5*sz)-cam.position.y)*k;cam.position.z+=((ez+7+8*sz)-cam.position.z)*k;cam.lookAt(ex,1+1.5*sz,ez)}
$('bPlay').onclick=()=>{show('egg');mode='egg';const e=$('eg');e.className='egg';void e.offsetWidth;e.classList.add('shk');
setTimeout(()=>e.classList.add('crk'),900);setTimeout(()=>{e.classList.remove('shk','crk');e.classList.add('open')},2300);
setTimeout(()=>{show('build');mode='build';setP(0);upBuild()},3400)};
requestAnimationFrame(loop);
</script></body></html>
